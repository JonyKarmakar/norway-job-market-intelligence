services:
  db:
    image: postgres:16-alpine
    container_name: njmi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-norway_jobs}
      POSTGRES_USER: ${POSTGRES_USER:-njmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - njmi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-njmi} -d ${POSTGRES_DB:-norway_jobs}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  njmi_postgres_data:
